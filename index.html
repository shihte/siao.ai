<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siao</title>
<meta name="description" content="The summit is a lie. The boulder is real.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/eb-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<main class="stage">
  <!-- Nothing to see: it exists so the page can tell when you are looking at
       the first viewport, which is the cue the whole act runs from. -->
  <div class="viewport-one" aria-hidden="true"></div>

  <!-- One body. The exits sit a fixed distance above the name and everything
       here moves together, because it is all struck by the same blow. -->
  <div class="wreck">
    <section class="exits" aria-label="Elsewhere">
      <ul class="places" id="places"></ul>
      <p class="email"><a href="mailto:hello@siao.ai">hello@siao.ai</a></p>
    </section>

    <h1 class="name">Siao</h1>
    <p class="statement">The summit is a lie. The boulder is real.</p>
  </div>

  <div class="boulder" aria-hidden="true">
    <svg viewBox="0 0 100 100" focusable="false">
      <path d="M95.6 56.4 83.2 72.4 64.5 94.7 40.1 89.8 20.6 82.7 11.1 52.7 8.7 29.8 23.2 20.3 46.9 5.1 65.9 14.4 85.2 20.4 89.8 40.1Z"/>
    </svg>
  </div>
</main>

<script src="/main.js"></script>
</body>
</html>
