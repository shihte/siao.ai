name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # macOS, because the visual baselines are rendered on macOS and Playwright
    # keys snapshots by platform. Free for public repositories.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
